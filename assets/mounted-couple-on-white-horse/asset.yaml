id: mounted-couple-on-white-horse
title: Couple riding a white horse with a hawk
description: A young man in a blue tunic hatched with gold, a red cap and black boots rides a white horse to the left, holding the red and gold reins in one hand and a brown hawk perched on the other, raised hand. Behind him sits a woman in an orange-red gown with gold hatching and a white veil under long black hair, one hand resting at her waist. Thin brown contours and gold highlights; the ground under the hooves and the background are transparent.
