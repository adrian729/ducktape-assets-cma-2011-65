# descriptive: find it and understand it
id: gray-acanthus-s-scroll
title: Gray acanthus S-scroll, right margin
description: A tall gray acanthus scroll from the right margin of the calendar frame. A long stem rises from a spiral at the bottom, swings through a large reverse curve in the middle and narrows to a point at the top, with folded leaves and a bud-like knob at the centre and hooked sprigs branching left and right; the leaves are blue-gray with white highlights and dark gray shadows. Transparent background.
