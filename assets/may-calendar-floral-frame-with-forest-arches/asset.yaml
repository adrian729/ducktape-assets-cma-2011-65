# descriptive: find it and understand it
id: may-calendar-floral-frame-with-forest-arches
title: May calendar page frame with two arches
description: "The complete frame of a calendar page. Across the top, two round arches on gold columns hold scenes against dense green foliage: a couple riding a white horse with a hawk at the left and a nude couple standing among trees at the right. The right and bottom margins carry flowers in pink, red and blue with green leaves and gray acanthus scrolls on a tan ground flecked with gold; a blue rule edges the left and divides the two text columns, which are transparent, as is the outside of the leaf."
